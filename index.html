<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Timeline Component — Demo</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; }
      body {
        margin: 0;
        padding: 1.5rem;
        font-family: system-ui, -apple-system, sans-serif;
        background: #f9fafb;
        color: #1f2937;
      }
      h1 { margin: 0 0 0.25rem; font-size: 1.75rem; }
      .subtitle { color: #6b7280; margin: 0 0 2rem; font-size: 0.95rem; }
      section { margin-bottom: 2.5rem; }
      h2 {
        font-size: 1.1rem;
        margin: 0 0 0.75rem;
        color: #374151;
        border-bottom: 1px solid #e5e7eb;
        padding-bottom: 0.5rem;
      }
      .demo-box {
        background: #fff;
        border: 1px solid #e5e7eb;
        border-radius: 8px;
        padding: 1rem;
        height: 340px;
      }
      #root { height: 100%; }
      .amd-link {
        display: inline-block;
        margin-top: 0.75rem;
        padding: 0.5rem 1rem;
        background: #3b82f6;
        color: #fff;
        border-radius: 6px;
        text-decoration: none;
        font-size: 0.9rem;
      }
      .amd-link:hover { background: #2563eb; }
    </style>
  </head>
  <body>
    <h1>Timeline Component</h1>
    <p class="subtitle">React + Vanilla JS AMD implementations — side-by-side demos</p>

    <section>
      <h2>React implementation</h2>
      <div class="demo-box">
        <div id="root"></div>
      </div>
    </section>

    <section>
      <h2>Vanilla JS / AMD implementation</h2>
      <p style="color:#6b7280;font-size:0.9rem;margin:0 0 0.75rem">
        The AMD demo runs as a standalone page so that RequireJS can be
        loaded without conflicting with the Vite/React bundle.
      </p>
      <a class="amd-link" href="/amd-demo.html">Open AMD demo →</a>
    </section>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
